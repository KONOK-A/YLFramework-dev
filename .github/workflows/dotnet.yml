name: YL Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Repository Tooling (No Unity)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false

      - name: Check PowerShell and prepare tool output parent
        run: |
          $version = $PSVersionTable.PSVersion
          if (-not $IsWindows -or $PSVersionTable.PSEdition -ne 'Core' -or
              $version.Major -ne 7 -or $version.Minor -ne 6) {
            throw "Expected Windows PowerShell Core 7.6.x; found $version"
          }
          if (-not (Test-Path -LiteralPath $env:GITHUB_WORKSPACE -PathType Container)) {
            throw 'Repository parent is missing.'
          }
          $null = [IO.Directory]::CreateDirectory((Join-Path $env:GITHUB_WORKSPACE 'Temp'))

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: Tools/YLFramework.Analyzers/global.json
          architecture: x64

      - name: Install pinned registry packaging Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3

      - name: Verify bundled npm identity
        run: |
          $node = (Get-Command node.exe -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
          $npm = Join-Path ([IO.Path]::GetDirectoryName($node)) 'node_modules/npm/bin/npm-cli.js'
          $version = & $node $npm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -cne '10.9.9') { throw "Expected bundled npm 10.9.9; found $version" }

      - name: Materialize approved product package binaries
        run: |
          git lfs pull --include="PackageSources/**/*.dll" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Git index hygiene
        run: pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLGitHygiene.ps1

      - name: Check CSharp whitespace only
        run: pwsh -NoLogo -NoProfile -NonInteractive -File Tools/CodeStyle/Format-YL.ps1 -Mode Check

      - name: Build and test Analyzer on .NET
        run: pwsh -NoLogo -NoProfile -NonInteractive -File Tools/YLFramework.Analyzers/build.ps1 -VerifyDeployment

      - name: Preserve reproducible build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-build-diagnostics
          path: |
            Temp/YLFramework.Analyzers/**/YLFramework.Analyzers.dll
            Temp/YLFramework.Analyzers/**/YLFramework.Analyzers.pdb
            Temp/YLFramework.Analyzers/**/YLFramework.Analyzers.AssemblyInfo.cs
            Temp/YLFramework.Analyzers/**/YLFramework.Analyzers.GeneratedMSBuildEditorConfig.editorconfig
            Temp/YLFramework.Analyzers/build-info.json
            PackageSources/com.kano.ylframework/Runtime/Core/Analyzers/YLFramework.Analyzers.dll
          if-no-files-found: ignore

      - name: Test harness contracts, not Unity acceptance
        run: pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLTesting.ps1 -TemporaryRoot $env:RUNNER_TEMP

      - name: Test UPM manifest and sample ownership contracts
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLDistributionManifest.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLDistributionEntryNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLSampleHost.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLIntegrationPackagesNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLIntegrationPackagesGitNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLIntegrationPackagesEntryNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/YLFramework.Analyzers/Tests/Test-DeploymentContract.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/YLFramework.Analyzers/Tests/Test-DeterministicBuild.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLDevelopmentHostNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLDevelopmentHostEntryNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/HybridCLR/Test-HybridCLRNativeSource.ps1 -TempRoot (Join-Path $env:RUNNER_TEMP ('yl-native-' + [Guid]::NewGuid().ToString('N')))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Registry packaging and installation contracts, not Unity acceptance
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLPackageCatalogNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nodeRoot = [IO.Path]::GetDirectoryName((Get-Command node.exe -CommandType Application -TotalCount 1 -ErrorAction Stop).Source)
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLRegistryPackagesNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP -NodeRoot $nodeRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLRegistryInstallationNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLRegistrySdkNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLRegistryLifecycleNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -NonInteractive -File Tools/Testing/Tests/Test-YLRegistryAuthoringNoUnity.ps1 -TemporaryRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and audit fixed-commit package artifacts
        id: registry-packages
        run: |
          $output = Join-Path $env:RUNNER_TEMP ('yl-registry-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $built = & ./Tools/Packaging/Build-YLRegistryPackages.ps1 -Repository $env:GITHUB_WORKSPACE -SourceCommit $env:GITHUB_SHA -OutputRoot $output
          . ./Tools/Testing/Common/Packages.ps1
          $expectedCount = (Read-YLPackageCatalog).packages.Count
          if ($built.packageCount -ne $expectedCount -or $built.sourceCommit -cne $env:GITHUB_SHA) { throw 'Incomplete fixed-commit package build.' }
          "artifactPath=$($built.artifacts)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Preserve readonly main-push release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: yl-registry-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.registry-packages.outputs.artifactPath }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Verify repository inputs were not changed
        run: |
          $changes = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes.Count -ne 0) {
            throw "CI changed repository paths: $($changes -join '; ')"
          }
